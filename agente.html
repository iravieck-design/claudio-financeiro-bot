<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente Google Ads</title>
<style>
:root{--bg:#f1f4fb;--ink:#56637f}
@media (prefers-color-scheme:dark){:root{--bg:#0a1330;--ink:#9aa8c7}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}
</style>
</head>
<body>
<p id="msg">Carregando o Agente Google Ads...</p>
<script>
// Carregador: a página do agente vem do Apps Script (?api=agentehtml), então muda sem republicar este arquivo.
// O endereço e a chave chegam pelo link da sala no escritório (#api=...&k=...); nada disso fica aqui.
(async function () {
  var msg = document.getElementById('msg');
  // O escritório às vezes guarda o link codificado duas vezes (https%253A...): desfaz até virar https://.
  var limpa = function (s) { s = String(s || '').replace(/&amp;/g, '&'); for (var n = 0; n < 3 && /^https?%3A/i.test(s); n++) s = decodeURIComponent(s); return s; };
  var h = new URLSearchParams(limpa(location.hash.slice(1)));
  var api = limpa(h.get('api')), k = h.get('k') || '';
  if (/^https:\/\//.test(api) && k) {
    // Deixa o endereço limpo para a página do agente, que lê o mesmo #api=...&k=...
    history.replaceState(null, '', location.pathname + location.search + '#api=' + encodeURIComponent(api) + '&k=' + encodeURIComponent(k));
  } else {
    try { api = JSON.parse(localStorage.getItem('ads-cfg') || '{}').api; } catch (e) {}
  }
  if (!api || !/^https:\/\//.test(api)) { msg.textContent = 'Abra pelo link da sala no escritório (o link traz a chave).'; return; }
  // Tenta 3 vezes (o Apps Script às vezes demora a acordar) e mostra o motivo se não der.
  var erro = '';
  for (var i = 0; i < 3; i++) {
    try {
      var r = await fetch(api + '?api=agentehtml&t=' + Date.now(), { credentials: 'omit', cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var html = await r.text();
      if (html.indexOf('<html') < 0) throw new Error('resposta inesperada: ' + html.slice(0, 80));
      document.open(); document.write(html); document.close();
      return;
    } catch (e) {
      erro = e && e.message ? e.message : String(e);
      if (i < 2) {
        msg.textContent = 'Conectando ao agente... (tentativa ' + (i + 2) + ' de 3)';
        await new Promise(function (ok) { setTimeout(ok, 1500 * (i + 1)); });
      }
    }
  }
  var destino = api.replace(/^https:\/\//, '').replace(/(\/s\/.{6}).*(.{6}\/exec)$/, '$1...$2');
  msg.textContent = 'Sem conexão com o agente (' + erro + ', endereço ' + destino + '). Recarregue a página ou abra numa aba nova.';
})();
</script>
</body>
</html>
