<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo da Velha LOOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Jogo da velha da LOOP: contra o computador ou em dupla (sala com código, servidor no projeto Agenda LOOP) */
:root{
  --bg:#f1f4fb; --surface:#ffffff; --ink:#0f1b33; --muted:#56637f; --line:#d8dfee;
  --accent:#1d4ed8; --accent-soft:#e3eafc; --hl:#f5c518; --hl-ink:#1b1500; --hl-soft:#fdf3c9;
  --x:#1d4ed8; --o:#d39e00; --in:#13824f; --out:#c2412d;
  --f-display:'Familjen Grotesk',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1330; --surface:#111e48; --ink:#e8edf9; --muted:#9aa8c7; --line:#243569;
  --accent:#6ea0ff; --accent-soft:#1a2d63; --hl:#ffd23f; --hl-ink:#1b1500; --hl-soft:#3a3214;
  --x:#6ea0ff; --o:#ffd23f; --in:#4fd08f; --out:#ff8a73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1330; --surface:#111e48; --ink:#e8edf9; --muted:#9aa8c7; --line:#243569;
  --accent:#6ea0ff; --accent-soft:#1a2d63; --hl:#ffd23f; --hl-ink:#1b1500; --hl-soft:#3a3214;
  --x:#6ea0ff; --o:#ffd23f; --in:#4fd08f; --out:#ff8a73; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem}
h1{font-family:var(--f-display);font-size:1.6rem;margin:0;line-height:1.1}
h2{font-family:var(--f-display);font-size:1.1rem;margin:0 0 10px}
.sub,.msg{color:var(--muted);font-size:.88rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 16px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.6;cursor:default}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.linha{display:flex;gap:8px;margin-top:10px}
.linha>*{flex:1}
.codigo{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.2em;text-align:center}
.status{font-family:var(--f-display);font-size:1.2rem;text-align:center;margin:0 0 12px;min-height:1.8em}
.tabuleiro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:0 auto}
.tabuleiro button{aspect-ratio:1;font-family:var(--f-display);font-size:3.2rem;font-weight:700;padding:0;border-radius:14px;line-height:1}
.tabuleiro .X{color:var(--x)}.tabuleiro .O{color:var(--o)}
.tabuleiro .vence{background:var(--hl-soft);border-color:var(--hl)}
.placar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}
.placar div{background:var(--bg);border-radius:10px;padding:8px}
.placar b{display:block;font-family:var(--f-mono);font-size:1.3rem}
.placar span{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.salabox{text-align:center;background:var(--hl-soft);border-radius:12px;padding:12px;margin-bottom:12px}
.salabox b{font-family:var(--f-mono);font-size:2rem;letter-spacing:.25em;display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">#</div><div><h1>Jogo da Velha LOOP</h1><div class="sub">Contra o computador ou com um colega, cada um no seu computador</div></div></header>

  <section id="inicio">
    <div class="panel">
      <h2>Seu nome</h2>
      <input id="nome" maxlength="20" placeholder="Seu nome" autocomplete="off">
    </div>
    <div class="panel">
      <h2>Contra o computador</h2>
      <div class="linha"><select id="nivel"><option value="facil">Fácil</option><option value="dificil">Difícil (não perde)</option></select>
        <button class="primary" id="btn-pc" type="button">Jogar</button></div>
    </div>
    <div class="panel" id="painel-dupla">
      <h2>Com um colega</h2>
      <button class="primary" id="btn-criar" type="button" style="width:100%">Criar sala e chamar alguém</button>
      <div class="linha"><input id="codigo" class="codigo" maxlength="4" placeholder="CÓDIGO"><button id="btn-entrar" type="button">Entrar na sala</button></div>
      <div class="msg" id="msg-dupla" style="margin-top:8px"></div>
    </div>
  </section>

  <section id="jogo" hidden>
    <div class="panel">
      <div class="salabox" id="salabox" hidden><span class="msg">Código da sala, mande para o colega no chat do escritório:</span><b id="sala-codigo"></b></div>
      <p class="status" id="status"></p>
      <div class="tabuleiro" id="tab"></div>
      <div class="placar">
        <div><b id="p-x">0</b><span id="n-x">X</span></div>
        <div><b id="p-e">0</b><span>Empates</span></div>
        <div><b id="p-o">0</b><span id="n-o">O</span></div>
      </div>
      <div class="linha"><button class="primary" id="btn-denovo" type="button" hidden>Jogar de novo</button><button id="btn-sair" type="button">Sair</button></div>
    </div>
  </section>
</div>
<script>
(function () {
  var limpa = function (s) { s = String(s || ''); for (var n = 0; n < 3 && /^https?%3A/i.test(s); n++) s = decodeURIComponent(s); return s; };
  var API = limpa(new URLSearchParams(location.hash.slice(1)).get('api'));
  if (!/^https:\/\//.test(API)) API = '';
  var $ = function (id) { return document.getElementById(id); };
  var LINHAS = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  var modo = '', estado = null, papel = 'X', token = '', sala = '', espera = null, enviando = false;
  var pc = { tab: '.........', vez: 'X', vencedor: null, linha: null, placar: { X: 0, O: 0, E: 0 }, comeca: 'X', nivel: 'facil' };

  try { $('nome').value = localStorage.getItem('velha-nome') || ''; } catch (e) {}
  if (!API) { $('painel-dupla').innerHTML = '<h2>Com um colega</h2><p class="msg">Abra pela sala do escritório para jogar em dupla.</p>'; }

  function nome() {
    var n = $('nome').value.trim().slice(0, 20);
    if (!n) { $('nome').focus(); $('nome').placeholder = 'Digite seu nome primeiro'; return ''; }
    try { localStorage.setItem('velha-nome', n); } catch (e) {}
    return n;
  }
  function mostra(t) { $('inicio').hidden = t !== 'inicio'; $('jogo').hidden = t !== 'jogo'; }

  // ---------- desenho ----------
  function desenha(st, minhaVez, nomes) {
    $('tab').innerHTML = st.tab.split('').map(function (c, i) {
      var v = st.linha && st.linha.indexOf(i) >= 0;
      return '<button type="button" data-i="' + i + '" class="' + (c !== '.' ? c : '') + (v ? ' vence' : '') + '"' +
        (c !== '.' || st.vencedor || !minhaVez ? ' disabled' : '') + '>' + (c !== '.' ? c : '') + '</button>';
    }).join('');
    $('p-x').textContent = st.placar.X; $('p-o').textContent = st.placar.O; $('p-e').textContent = st.placar.E;
    $('n-x').textContent = 'X · ' + nomes.x; $('n-o').textContent = 'O · ' + nomes.o;
    $('btn-denovo').hidden = !st.vencedor;
  }

  $('tab').addEventListener('click', function (e) {
    var b = e.target.closest('[data-i]');
    if (!b || b.disabled) return;
    var i = Number(b.getAttribute('data-i'));
    if (modo === 'pc') jogaPc(i); else jogaOnline(i);
  });

  // ---------- contra o computador ----------
  function vencedor(t) {
    for (var k = 0; k < 8; k++) { var l = LINHAS[k]; if (t[l[0]] !== '.' && t[l[0]] === t[l[1]] && t[l[1]] === t[l[2]]) return { v: t[l[0]], linha: l }; }
    return t.indexOf('.') < 0 ? { v: 'E', linha: null } : null;
  }
  function minimax(t, quem) {
    var r = vencedor(t);
    if (r) return { nota: r.v === 'O' ? 10 : r.v === 'X' ? -10 : 0 };
    var melhor = { nota: quem === 'O' ? -99 : 99, casa: -1 };
    for (var i = 0; i < 9; i++) {
      if (t[i] !== '.') continue;
      var n = minimax(t.slice(0, i) + quem + t.slice(i + 1), quem === 'O' ? 'X' : 'O').nota;
      n = n > 0 ? n - 1 : n < 0 ? n + 1 : 0; // prefere ganhar logo e perder tarde
      if (quem === 'O' ? n > melhor.nota : n < melhor.nota) melhor = { nota: n, casa: i };
    }
    return melhor;
  }
  function lancePc() {
    var livres = []; for (var i = 0; i < 9; i++) if (pc.tab[i] === '.') livres.push(i);
    if (pc.nivel === 'facil' && Math.random() < 0.55) return livres[Math.floor(Math.random() * livres.length)];
    return minimax(pc.tab, 'O').casa;
  }
  function marcaPc(i, quem) {
    pc.tab = pc.tab.slice(0, i) + quem + pc.tab.slice(i + 1);
    var r = vencedor(pc.tab);
    if (r) { pc.vencedor = r.v; pc.linha = r.linha; pc.placar[r.v]++; } else pc.vez = quem === 'X' ? 'O' : 'X';
  }
  function telaPc() {
    var st = pc, msg;
    if (st.vencedor === 'X') msg = 'Você ganhou! 🎉'; else if (st.vencedor === 'O') msg = 'O computador ganhou.'; else if (st.vencedor === 'E') msg = 'Deu velha (empate).';
    else msg = st.vez === 'X' ? 'Sua vez (você é o X)' : 'Computador pensando...';
    $('status').textContent = msg;
    desenha(st, st.vez === 'X', { x: $('nome').value.trim() || 'Você', o: 'Computador' });
  }
  function jogaPc(i) {
    if (pc.vez !== 'X' || pc.vencedor) return;
    marcaPc(i, 'X'); telaPc();
    if (!pc.vencedor) setTimeout(function () { marcaPc(lancePc(), 'O'); telaPc(); }, 450);
  }
  function novaPc() {
    pc.tab = '.........'; pc.vencedor = null; pc.linha = null;
    pc.comeca = pc.comeca === 'X' ? 'O' : 'X'; pc.vez = pc.comeca; // alterna quem começa
    telaPc();
    if (pc.vez === 'O') setTimeout(function () { marcaPc(lancePc(), 'O'); telaPc(); }, 450);
  }
  $('btn-pc').onclick = function () {
    if (!nome()) return;
    modo = 'pc'; pc.nivel = $('nivel').value; pc.placar = { X: 0, O: 0, E: 0 }; pc.comeca = 'O';
    $('salabox').hidden = true; mostra('jogo'); novaPc();
  };

  // ---------- em dupla ----------
  function api(corpo) {
    return fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) })
      .then(function (r) { return r.json(); });
  }
  function telaOnline() {
    var st = estado; if (!st) return;
    var outro = papel === 'X' ? 'O' : 'X', msg;
    $('salabox').hidden = !!st.o; // código aparece até o colega entrar
    if (!st.o) msg = 'Esperando o colega entrar...';
    else if (st.vencedor === 'E') msg = 'Deu velha (empate).';
    else if (st.vencedor) msg = st.vencedor === papel ? 'Você ganhou! 🎉' : (st[outro.toLowerCase()] || 'O colega') + ' ganhou.';
    else msg = st.vez === papel ? 'Sua vez (você é o ' + papel + ')' : 'Vez de ' + (st[outro.toLowerCase()] || 'o colega') + '...';
    $('status').textContent = msg;
    desenha(st, !!st.o && st.vez === papel && !enviando, { x: st.x || 'X', o: st.o || 'esperando' });
    $('btn-denovo').textContent = 'Revanche';
  }
  function acompanha() {
    clearInterval(espera);
    espera = setInterval(function () {
      if (document.hidden || enviando) return;
      fetch(API + '?velha=' + sala + '&t=' + Date.now(), { credentials: 'omit' }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.erro) { $('status').textContent = j.erro; clearInterval(espera); return; }
        if (!estado || j.atualizado !== estado.atualizado) { estado = j; telaOnline(); }
      }).catch(function () {});
    }, 1000);
  }
  function entraNoJogo(j) {
    if (j.erro) { $('msg-dupla').textContent = j.erro; return; }
    token = j.token; papel = j.papel; estado = j.estado; sala = estado.sala; modo = 'dupla';
    $('sala-codigo').textContent = sala;
    mostra('jogo'); telaOnline(); acompanha();
  }
  function jogaOnline(i) {
    if (enviando) return;
    enviando = true;
    estado.tab = estado.tab.slice(0, i) + papel + estado.tab.slice(i + 1); telaOnline(); // mostra na hora
    api({ velha: 'jogar', sala: sala, token: token, casa: i }).then(function (j) {
      enviando = false;
      if (j.erro) $('status').textContent = j.erro; else { estado = j.estado; telaOnline(); }
    }).catch(function () { enviando = false; $('status').textContent = 'Falhou ao enviar, tente de novo.'; });
  }
  if (API) {
    $('btn-criar').onclick = function () {
      var n = nome(); if (!n) return;
      $('msg-dupla').textContent = 'Criando sala...';
      api({ velha: 'criar', nome: n }).then(entraNoJogo).catch(function () { $('msg-dupla').textContent = 'Não consegui criar a sala agora.'; });
    };
    $('btn-entrar').onclick = function () {
      var n = nome(); if (!n) return;
      var c = $('codigo').value.trim().toUpperCase();
      if (c.length !== 4) { $('msg-dupla').textContent = 'Digite o código de 4 letras.'; return; }
      $('msg-dupla').textContent = 'Entrando...';
      api({ velha: 'entrar', sala: c, nome: n }).then(entraNoJogo).catch(function () { $('msg-dupla').textContent = 'Não consegui entrar agora.'; });
    };
    $('codigo').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btn-entrar').click(); });
  }

  $('btn-denovo').onclick = function () {
    if (modo === 'pc') { novaPc(); return; }
    api({ velha: 'revanche', sala: sala, token: token }).then(function (j) { if (!j.erro) { estado = j.estado; telaOnline(); } });
  };
  $('btn-sair').onclick = function () { clearInterval(espera); modo = ''; mostra('inicio'); };
})();
</script>
</body>
</html>
